version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  # Not /server: its file:../../couchdb-node link can't resolve in Dependabot's
  # checkout. Add it back once couchdb-node is on npm.
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups:
      npm: { patterns: ["*"] }
