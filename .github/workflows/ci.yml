name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      couchdb:
        image: couchdb:3.5.2
        env:
          COUCHDB_USER: admin
          COUCHDB_PASSWORD: password
        ports: ["5984:5984"]
    steps:
      # couchdb-node isn't on npm yet. server/package.json links it from
      # ../../couchdb-node, so check both repos out side by side.
      - uses: actions/checkout@v7
        with:
          path: demo-couchdb-react
      - uses: actions/checkout@v7
        with:
          repository: laveresteban/couchdb-node
          ref: main
          path: couchdb-node
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            couchdb-node/package-lock.json
            demo-couchdb-react/server/package-lock.json
      - name: Build couchdb-node
        working-directory: couchdb-node
        run: npm ci && npm run build
      - name: Wait for CouchDB
        run: |
          for i in $(seq 1 30); do curl -fs http://localhost:5984/_up && break; sleep 2; done
          curl -fsS -X PUT -u admin:password http://localhost:5984/_users
      - working-directory: demo-couchdb-react/server
        run: npm ci
      - working-directory: demo-couchdb-react/server
        run: npm run typecheck
      - working-directory: demo-couchdb-react/server
        run: npm test
        env:
          COUCHDB_URL: http://localhost:5984

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 7
